services:
 postgres:
  image: postgres:16-alpine
  environment:
   POSTGRES_DB: aut
   POSTGRES_USER: aut
   POSTGRES_PASSWORD: aut
  healthcheck: {test: ["CMD-SHELL","pg_isready -U aut -d aut"], interval: 3s, timeout: 3s, retries: 10}
  volumes: [pgdata:/var/lib/postgresql/data]
 redis:
  image: redis:7-alpine
  command: ["redis-server","--appendonly","yes"]
  healthcheck: {test: ["CMD","redis-cli","ping"], interval: 3s, timeout: 2s, retries: 10}
  volumes: [redisdata:/data]
 app:
  build: .
  environment:
   DATABASE_URL: postgres://aut:aut@postgres:5432/aut?sslmode=disable
   REDIS_ADDR: redis:6379
   JWT_SECRET: change-me-to-a-random-32-byte-secret-in-real-env
   ENVIRONMENT: production
  ports: ["8080:8080"]
  depends_on:
   postgres: {condition: service_healthy}
   redis: {condition: service_healthy}
volumes: {pgdata: {}, redisdata: {}}
